<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Space Invaders — Vector Spaces — The Hidden Skeleton</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#e5e5e5;font-family:'Inter','Segoe UI',system-ui,sans-serif;overflow:hidden;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}canvas{display:block;border-radius:12px}.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:10}.ov>div{pointer-events:auto}.sc{text-align:center;background:rgba(10,10,10,0.97);border:1px solid rgba(22,163,74,0.3);border-radius:16px;padding:48px;max-width:480px;box-shadow:0 0 60px rgba(22,163,74,0.1)}.sc h1{font-size:30px;font-weight:800;background:linear-gradient(135deg,#a855f7,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}.sc .su{font-size:13px;color:#888;margin-bottom:24px;text-transform:uppercase;letter-spacing:0.1em}.sc p{font-size:14px;color:#aaa;line-height:1.7;margin-bottom:24px}.bt{padding:14px 40px;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;font-size:15px;font-weight:700;border:none;border-radius:10px;cursor:pointer;text-transform:uppercase;letter-spacing:0.08em;transition:all 0.2s}.bt:hover{transform:translateY(-2px)}.sg{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}.sb{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:16px}.sb .v{font-size:28px;font-weight:800}.sb .l{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:0.08em;margin-top:4px}.g .v{color:#16a34a}.a .v{color:#f59e0b}
.fb{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:opacity 0.3s;max-width:500px;text-align:center;pointer-events:none}.fb.show{opacity:1}.fb.ok{background:rgba(22,163,74,0.2);border:1px solid #16a34a;color:#4ade80}.fb.no{background:rgba(239,68,68,0.2);border:1px solid #ef4444;color:#fca5a5}
</style></head><body><canvas id="c"></canvas>
<div class="ov"><div id="ts" class="sc"><h1>👾 Space Invaders</h1><div class="su">Mathematics in Machine Learning — Vector Spaces — The Hidden Skeleton</div><p>Alien invaders carry answer labels! Shoot the <strong>correct answer</strong> invaders with <strong>Space</strong>. Move with <strong>← →</strong>. Don't shoot wrong answers!</p><button class="bt" onclick="go()">Defend Earth</button></div><div id="es" class="sc" style="display:none"><h1 id="et"></h1><div class="su">Vector Spaces — The Hidden Skeleton</div><div class="sg"><div class="sb g"><div class="v" id="s1">0</div><div class="l">Correct Hits</div></div><div class="sb"><div class="v" id="s2">0</div><div class="l">Wrong Hits</div></div><div class="sb a"><div class="v" id="s3">0</div><div class="l">XP</div></div><div class="sb"><div class="v" id="s4">0%</div><div class="l">Accuracy</div></div></div><button class="bt" onclick="go()">Play Again</button></div></div>
<div class="fb" id="fb"></div>
<script>
const QS=[{"question":"Which set of vectors is linearly dependent?","correct":"[2, 4] and [1, 2]","wrong":["[1, 0] and [0, 1]","[1, 2] and [3, 4]","[1, 0] and [1, 1]"],"explanation":"[2, 4] = 2 × [1, 2]. One is a scalar multiple of the other — they point in the same direction."},{"question":"The 'span' of a set of vectors is:","correct":"Everything reachable by adding and scaling combinations of those vectors","wrong":["The length of the longest vector","The number of vectors in the set","The angle between first and last vector"],"explanation":"Span is all possible linear combinations — every destination reachable by scaling and summing the vectors."},{"question":"A 3D vector space has a basis. How many vectors does it contain?","correct":"Exactly 3","wrong":["Any number needed","At least 3 — more is allowed","It varies with the shape of the space"],"explanation":"A basis for an n-dimensional space contains exactly n linearly independent vectors. For 3D: exactly 3."},{"question":"Why did Grassmann's 1844 book go unrecognised for decades?","correct":"The ideas were ahead of existing mathematical language","wrong":["It contained significant errors","He published in Sanskrit","The book was destroyed in a fire"],"explanation":"The reviewers' response was incomprehension, not disagreement — the conceptual framework didn't exist yet."},{"question":"In the Color Forger story, the orange paint tube was redundant because:","correct":"Orange can be mixed from red and yellow — it adds no new direction","wrong":["Orange was too expensive","Forgers never use orange","It was dried out"],"explanation":"Orange = red + yellow. Removing it doesn't shrink the span of reachable colors. This is linear dependence."},{"question":"The fluorescent titanium white paint was NOT redundant because:","correct":"No combination of traditional pigments can produce UV fluorescence","wrong":["It was more expensive","It was a brighter color","It mixed with more paints"],"explanation":"Fluorescence is a genuinely new direction in color-space — outside the span of 17th-century materials."},{"question":"A neural network layer is learning to find:","correct":"A useful basis — the meaningful directions in the data","wrong":["The shortest vector possible","Random directions to add noise","How to delete dimensions"],"explanation":"Each layer transforms vectors, learning which directions are useful. Redundant directions get suppressed."},{"question":"Every 'tensor' in TensorFlow is fundamentally a:","correct":"Grassmannian object from abstract algebra","wrong":["Physical force measurement","Database record","Image pixel grid"],"explanation":"Grassmann invented the abstract algebra underlying vector spaces. Every tensor in ML frameworks rests on his 1844 work."},{"question":"Two parallel vectors span:","correct":"Only a line — one is redundant","wrong":["A full plane","A 3D space","Nothing at all"],"explanation":"Parallel vectors point in the same direction. They can only reach points along that line, not the whole plane."},{"question":"The dimension of a vector space is defined as:","correct":"The number of vectors in any basis for that space","wrong":["The length of the longest vector","The total number of vectors in the space","The number of operations performed"],"explanation":"Dimension equals the number of basis vectors needed — this number is the same regardless of which basis you choose."},{"question":"If u₁ = [1,1] and u₂ = [1,−1], can they span 2D space?","correct":"Yes — they are independent and you can reach any 2D point","wrong":["No — they must be the standard axes","Only if you add a third vector","Only for positive coordinates"],"explanation":"Any two linearly independent vectors in 2D form a valid basis. For [3,5]: 4×[1,1] + (−1)×[1,−1] = [3,5]."}];const cv=document.getElementById('c'),cx=cv.getContext('2d');
const W=Math.min(window.innerWidth-40,900),H=Math.min(window.innerHeight-40,650);cv.width=W;cv.height=H;
const AC=new(window.AudioContext||window.webkitAudioContext)();function tone(f,d,t='sine'){const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=0.05;g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}
let state='TITLE',ship={x:W/2,y:H-50,w:30,h:20},bullets=[],invaders=[],parts=[];
let queue=[],qIdx=0,cc=0,wc=0,fc=0,lives=3,curQ=null,cooldown=0;
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function fb(t,c){const e=document.getElementById('fb');e.textContent=t;e.className='fb show '+c;setTimeout(()=>e.className='fb',2200);}
function spawnWave(){if(qIdx>=queue.length){endG();return;}curQ=queue[qIdx];const opts=shuf([curQ.correct,...curQ.wrong.slice(0,3)]);invaders=[];
const iw=100,ih=30,gap=16,total=opts.length,startX=(W-total*(iw+gap)+gap)/2;
opts.forEach((o,i)=>{invaders.push({x:startX+i*(iw+gap)+iw/2,y:80,w:iw,h:ih,text:o,correct:o===curQ.correct,alive:true,dir:1,speed:0.5});});qIdx++;}
function addBurst(x,y,col){for(let i=0;i<8;i++){const a=Math.PI*2/8*i;parts.push({x,y,vx:Math.cos(a)*(2+Math.random()*3),vy:Math.sin(a)*(2+Math.random()*3),life:1,dec:0.04,r:2+Math.random()*2,col});}}
function go(){document.getElementById('ts').style.display='none';document.getElementById('es').style.display='none';state='PLAYING';queue=shuf(QS);qIdx=0;cc=0;wc=0;lives=3;parts=[];cooldown=0;if(AC.state==='suspended')AC.resume();spawnWave();}
function endG(){state='OVER';curQ=null;const t=cc+wc,acc=t?Math.round(cc/t*100):0;document.getElementById('et').textContent=lives>0?'👾 Earth Saved!':'💥 Invaded!';document.getElementById('s1').textContent=cc;document.getElementById('s2').textContent=wc;document.getElementById('s3').textContent=cc*50;document.getElementById('s4').textContent=acc+'%';document.getElementById('es').style.display='block';}
let keys={};document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')e.preventDefault();});document.addEventListener('keyup',e=>{keys[e.key]=false;});

function update(){fc++;cooldown--;
if(keys['ArrowLeft']||keys['a'])ship.x-=6;if(keys['ArrowRight']||keys['d'])ship.x+=6;ship.x=Math.max(ship.w/2,Math.min(W-ship.w/2,ship.x));
if((keys[' ']||keys['ArrowUp'])&&cooldown<=0){bullets.push({x:ship.x,y:ship.y-ship.h/2,vy:-8});cooldown=15;tone(1000,0.03);}
// Bullets
for(let i=bullets.length-1;i>=0;i--){bullets[i].y+=bullets[i].vy;if(bullets[i].y<0){bullets.splice(i,1);continue;}
let hit=false;invaders.forEach(inv=>{if(!inv.alive)return;if(bullets[i]&&Math.abs(bullets[i].x-inv.x)<inv.w/2&&Math.abs(bullets[i].y-inv.y)<inv.h/2){hit=true;inv.alive=false;addBurst(inv.x,inv.y,inv.correct?'#16a34a':'#ef4444');
if(inv.correct){tone(523,0.1);setTimeout(()=>tone(784,0.12),60);cc++;fb('✓ Correct!','ok');setTimeout(()=>spawnWave(),600);}
else{tone(200,0.2,'sawtooth');wc++;lives--;fb('✗ Wrong target!','no');if(lives<=0)endG();}}});if(hit)bullets.splice(i,1);}
// Invaders move
invaders.forEach(inv=>{if(!inv.alive)return;inv.x+=inv.dir*inv.speed;});
const aliveInvs=invaders.filter(i=>i.alive);
if(aliveInvs.length>0&&(aliveInvs.some(i=>i.x+i.w/2>W-10)||aliveInvs.some(i=>i.x-i.w/2<10))){invaders.forEach(i=>{i.dir*=-1;i.y+=15;});}
if(aliveInvs.some(i=>i.y+i.h/2>ship.y-20)){lives--;if(lives<=0)endG();else spawnWave();}
for(let i=parts.length-1;i>=0;i--){parts[i].x+=parts[i].vx;parts[i].y+=parts[i].vy;parts[i].life-=parts[i].dec;if(parts[i].life<=0)parts.splice(i,1);}}

function draw(){cx.clearRect(0,0,W,H);cx.fillStyle='#050510';cx.fillRect(0,0,W,H);
for(let i=0;i<60;i++){cx.fillStyle='rgba(255,255,255,'+(0.15+Math.sin(fc*0.01+i)*0.1)+')';cx.beginPath();cx.arc((i*37)%W,(i*53+fc*0.05)%H,0.7,0,Math.PI*2);cx.fill();}
if(state==='PLAYING'){update();
cx.fillStyle='rgba(10,10,10,0.85)';cx.fillRect(0,0,W,55);if(curQ){cx.fillStyle='#e5e5e5';cx.font='600 13px Inter,system-ui';cx.textAlign='center';cx.fillText(curQ.question,W/2,20);}
cx.textAlign='left';for(let i=0;i<3;i++){cx.fillStyle=i<lives?'#ef4444':'#333';cx.font='14px sans-serif';cx.fillText('♥',16+i*20,42);}
cx.textAlign='right';cx.fillStyle='#f59e0b';cx.font='700 14px Inter,system-ui';cx.fillText(cc*50+' XP',W-16,42);
// Invaders
invaders.forEach(inv=>{if(!inv.alive)return;cx.fillStyle='rgba(168,85,247,0.2)';cx.fillRect(inv.x-inv.w/2,inv.y-inv.h/2,inv.w,inv.h);cx.strokeStyle='rgba(168,85,247,0.5)';cx.lineWidth=1.5;cx.strokeRect(inv.x-inv.w/2,inv.y-inv.h/2,inv.w,inv.h);cx.fillStyle='#e5e5e5';cx.font='600 10px Inter,system-ui';cx.textAlign='center';cx.textBaseline='middle';let txt=inv.text;if(cx.measureText(txt).width>inv.w-10)txt=txt.slice(0,Math.floor(inv.w/7))+'…';cx.fillText(txt,inv.x,inv.y);cx.textBaseline='alphabetic';});
// Ship
cx.fillStyle='#22d3ee';cx.shadowColor='#22d3ee';cx.shadowBlur=10;cx.beginPath();cx.moveTo(ship.x,ship.y-ship.h);cx.lineTo(ship.x-ship.w/2,ship.y);cx.lineTo(ship.x+ship.w/2,ship.y);cx.fill();cx.shadowBlur=0;
// Bullets
bullets.forEach(b=>{cx.fillStyle='#f59e0b';cx.fillRect(b.x-1.5,b.y,3,10);});
// Particles
parts.forEach(p=>{cx.globalAlpha=p.life;cx.fillStyle=p.col;cx.beginPath();cx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);cx.fill();});cx.globalAlpha=1;}
requestAnimationFrame(draw);}draw();
</script></body></html>
